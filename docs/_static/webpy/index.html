import sys, io, ast
import os
os.chdir('/')
__last_plot__ = ''
__webpy_code__ = ''

def __webpy_run(code):
    """以交互模式运行代码，自动打印最后一个表达式的值"""
    tree = ast.parse(code)
    body = tree.body
    if not body:
        return
    if isinstance(body[-1], ast.Expr):
        # 前面的语句用 exec 执行
        if len(body) > 1:
            exec(compile(ast.Module(body=body[:-1], type_ignores=[]), '<input>', 'exec'))
        # 最后一个表达式用 eval 求值并打印
        result = eval(compile(ast.Expression(body=body[-1].value), '<input>', 'eval'))
        if result is not None:
            print(result)
    else:
        exec(code)

import sys

def safe_reset_kernel():
    # 1. 获取主模块
    main = sys.modules['__main__']
    
    # 2. 定义“白名单”：这些变量绝对不能删
    # 包含了 Python 运行基石 (__builtins__, __name__) 和 Pyodide 核心 (_pyodide_core)
    keep = {
        '__name__', '__doc__', '__package__', '__loader__', 
        '__spec__', '__builtins__', '__annotations__', 
        '_pyodide_core', 'sys', 'os', 'io'  # 建议显式保留常用的系统库
    }
    
    # 3. 只删除不在白名单中的变量
    # 使用 list() 包装是为了防止在遍历字典时修改字典大小导致的错误
    for key in list(main.__dict__.keys()):
        if key not in keep:
            # 打印删除的内容以便调试（可选）
            # print(f"Deleting: {key}")
            del main.__dict__[key]
